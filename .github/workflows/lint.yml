name: lint

on:
  push:
    branches: [master]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "docs/**"

# Same steps as unict-dmi/reusable-workflows python-lint.yml, which is pinned to
# Python 3.12 and can't parse `lazy import` (3.15+)
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.15
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install dependencies for requirements and testing
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi

      - name: Lint with pylint
        run: pylint $(git ls-files '*.py')

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with mypy
        run: mypy $(git ls-files '*.py')

      - name: Check code formatting with black
        run: black --check --diff $(git ls-files '*.py')

      - name: Check code formatting with isort
        run: isort --check-only --diff $(git ls-files '*.py')
